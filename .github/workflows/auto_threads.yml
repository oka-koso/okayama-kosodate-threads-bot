name: Auto Threads Posts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: threads-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load Threads token
        env:
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_FALLBACK_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          if [ -f threads_token.enc ]; then
            TOKEN="$(openssl enc -d -aes-256-cbc -pbkdf2 -a -A               -in threads_token.enc               -pass env:THREADS_APP_SECRET)"
          else
            TOKEN="$THREADS_FALLBACK_TOKEN"
          fi
          echo "::add-mask::$TOKEN"
          echo "THREADS_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run automatic Threads poster
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python auto_post.py

      - name: Save posting state
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update Threads posting state"
          git push
